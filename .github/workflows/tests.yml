name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check web/app.js

      - run: node --check web/file-access.js
      - run: node --test tests/desktop_paths.test.cjs
  desktop:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python scripts/prepare_desktop.py
      - shell: pwsh
        run: |
          $env:REVIEW_TEST_ROOT = Join-Path $env:RUNNER_TEMP 'subtitle-desktop-tests'
          New-Item -ItemType Directory -Path $env:REVIEW_TEST_ROOT -Force | Out-Null
          $env:REVIEW_BROWSER_PATH = (Get-Command chrome -ErrorAction SilentlyContinue).Source
          if (-not $env:REVIEW_BROWSER_PATH) { $env:REVIEW_BROWSER_PATH = 'C:/Program Files/Google/Chrome/Application/chrome.exe' }
          node tests/file_access_ui_check.cjs
          if ($LASTEXITCODE -ne 0) { throw 'File access UI check failed' }
          node tests/job_recovery_ui_check.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Failed episode recovery UI check failed' }
          node tests/desktop_drop_check.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Desktop drag-and-drop check failed' }
